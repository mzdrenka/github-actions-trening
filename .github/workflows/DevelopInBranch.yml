name: Develop in a branch

on: 
  pull_request:
  workflow_dispatch:
    inputs:
      debug_on:
        default: 'false'
        description: "Turn on debug"
        type: choice
        options:
          - true
          - false

env:
  ACTIONS_STEP_DEBUG: ${inputs.debug_on}

jobs:
  job1:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
    - run: |
        echo "${{ github.event.pull_request.title }}"
    - run: |
        echo "Przepływ pracy wyzwolony w odgałęzieniu '${{ github.ref }}'."
        echo "Przepływ pracy wyzwolony przez zdarzenie '${{ github.event_name }}'."
        echo "Przepływ pracy wyzwolony przez aktora '${{ github.actor }}''."
    - run: |
        echo "::debug::To jest komunikat debugowania."
        echo "::notice::To jest komunikat powiadomienia."
        echo "::warning::To jest komunikat ostrzegawczy."
        echo "::error::To jest komunikat o błędzie."
    - run: |
        echo "::notice file=.github/workflows/DevelopInBranch.yml,line=19,col=11,endColumn=51::Istnieje komunikat debugowania, który nie zawsze jest widoczny!"
        echo "::warning file=.github/workflows/DevelopInBranch.yml,line=19,endline=21::Mnóstwo komunikatów"
        echo "::error title=Script Injection,file=.github/workflows/DevelopInBranch.yml,line=13,col=37,endColumn=68::Potencjalne wstrzyknięcie skryptu"
    - uses: actions/checkout@v4.1.0
    - uses: devops-actions/actionlint@v0.1.12
